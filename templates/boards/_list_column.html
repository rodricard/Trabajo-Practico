<div class="kanban-list">
    <div class="list-header">
        <h3 class="list-title">{{ lst.title }}</h3>
        <form method="post" action="{% url 'list_delete' lst.pk %}"
              onsubmit="return confirm('&#191;Eliminar lista y sus tarjetas?')">
            {% csrf_token %}
            <button type="submit" class="btn-icon" title="Eliminar lista">&times;</button>
        </form>
    </div>

    <div class="cards-container" data-list-id="{{ lst.pk }}">
        {% for card in lst.cards.all %}
        {% include 'boards/_card_item.html' %}
        {% empty %}
        <p class="list-empty">Sin tarjetas</p>
        {% endfor %}
    </div>

    <form method="post" action="{% url 'card_create' lst.pk %}" class="add-card-form">
        {% csrf_token %}
        {{ card_form.title }}
        <button type="submit" class="btn btn-ghost btn-sm">+ Agregar tarjeta</button>
    </form>
</div>
